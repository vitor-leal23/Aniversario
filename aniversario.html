<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feliz Aniversário, Amor ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--rose:#e8476a;--tulip:#ff6b9d;--gold:#d4a853;--cream:#f5e6d3}
body{min-height:100vh;background:linear-gradient(160deg,#0a0a0a 0%,#1a1a1a 40%,#2a2a2a 70%,#3a3636 100%);font-family:'Cormorant Garamond',serif;overflow-x:hidden;color:#fff}

/* ── CANVAS FLORES ── */
#canvas{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fl{position:absolute;animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0deg) scale(0.7);opacity:0}
  10%{opacity:.55}
  80%{opacity:.45}
  100%{transform:translateY(-15vh) rotate(360deg) scale(1.1);opacity:0}
}
.fl svg{display:block;filter:drop-shadow(0 0 6px currentColor)}

/* ── HEADER ── */
header{position:relative;z-index:1;text-align:center;padding:80px 20px 40px}
header h1{font-family:'Cinzel',serif;font-size:clamp(2rem,6vw,4rem);font-weight:600;letter-spacing:.15em;background:linear-gradient(135deg,#fff 30%,var(--gold) 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none}
header p{font-style:italic;font-size:clamp(1rem,2.5vw,1.4rem);color:#ccc;margin-top:12px;letter-spacing:.06em}
.divider{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px auto}

/* ── GRID CARDS ── */
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:20px 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px}
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;overflow:hidden;transition:transform .3s,box-shadow .3s;backdrop-filter:blur(6px)}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 20px rgba(232,71,106,.15)}
.photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer;background:#1e1e1e;position:relative}
.photo-placeholder{width:100%;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a1a,#2d2d2d);cursor:pointer;gap:8px;border-bottom:1px solid rgba(255,255,255,.06)}
.photo-placeholder svg{opacity:.35}
.photo-placeholder span{font-size:.75rem;color:#666;letter-spacing:.08em}
.photo-placeholder input{display:none}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.verse{padding:18px 16px 20px;text-align:center}
.verse q{display:block;font-style:italic;font-size:clamp(.82rem,1.8vw,.95rem);line-height:1.65;color:#e8ddd0;letter-spacing:.02em}
.verse cite{display:block;margin-top:10px;font-size:.72rem;color:var(--gold);letter-spacing:.12em;font-style:normal;text-transform:uppercase}

/* ── FOOTER ── */
footer{position:relative;z-index:1;text-align:center;padding:30px 20px 50px;color:#555;font-size:.8rem;letter-spacing:.05em}
footer span{color:var(--rose)}

/* ── RESPONSIVE ── */
@media(max-width:500px){
  main{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}
  .verse{padding:12px 10px 14px}
}
</style>
</head>
<body>

<div id="canvas"></div>
<canvas id="fw" style="position:fixed;inset:0;pointer-events:none;z-index:10;display:none"></canvas>

<header>
  <h1>Feliz 21 Anos, Amor</h1>
  <p>Para a pessoa mais linda do meu mundo</p>
  <div class="divider"></div>
</header>

<main id="grid"></main>

<footer>Feito com <span>♥</span> para você, hoje e sempre.</footer>

<script>
// ── DADOS DOS CARDS ──
const verses=[
  {q:"Quero fazer contigo o que a primavera faz com as cerejeiras.",a:"Pablo Neruda"},
  {q:"Amar é encontrar na felicidade do outro a própria felicidade.",a:"Clarice Lispector"},
  {q:"Que seja infinito enquanto dure, e que dure por toda a eternidade.",a:"Vinícius de Moraes"},
  {q:"Duvide das estrelas se são chamas, duvide do sol se movimenta — mas nunca do meu amor.",a:"William Shakespeare"},
  {q:"O amor é a única coisa que cresce quando é repartida.",a:"Antoine de Saint-Exupéry"},
  {q:"Duas almas com um único pensamento, dois corações que batem como um só.",a:"Friedrich Halm"},
  {q:"O amor não é olhar um para o outro, mas olhar juntos na mesma direção.",a:"Antoine de Saint-Exupéry"},
  {q:"Amar não é apenas sentir-se bem. É sentir que tudo é bem, porque você existe.",a:"Victor Hugo"},
  {q:"Tu és minha vida, minha razão de ser, meu eterno recomeço.",a:"Rumi"},
  {q:"O amor é a única paixão que se paga com uma moeda que ela própria fabrica.",a:"Stendhal"}
];

// ── GERA CARDS ──
const grid=document.getElementById('grid');
verses.forEach((_,i)=>{
  const c=document.createElement('div');
  c.className='card';
  c.innerHTML=`
    <label class="photo-placeholder" id="lbl${i}">
      <input type="file" accept="image/*" onchange="loadImg(this,${i})">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <span>Adicionar foto</span>
    </label>
    <div class="verse"><q>${verses[i].q}</q><cite>— ${verses[i].a}</cite></div>`;
  grid.appendChild(c);
});

function loadImg(input,idx){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    const lbl=document.getElementById('lbl'+idx);
    const img=document.createElement('img');
    img.src=e.target.result;
    lbl.replaceWith(img);
  };
  r.readAsDataURL(f);
}

// ── FLORES SVG ──
function rose(c){
  return`<svg width="36" height="36" viewBox="0 0 36 36" style="color:${c}">
    <ellipse cx="18" cy="22" rx="10" ry="8" fill="currentColor" opacity=".9"/>
    <ellipse cx="12" cy="18" rx="7" ry="5" fill="currentColor" opacity=".8" transform="rotate(-30 12 18)"/>
    <ellipse cx="24" cy="18" rx="7" ry="5" fill="currentColor" opacity=".8" transform="rotate(30 24 18)"/>
    <ellipse cx="18" cy="14" rx="6" ry="5" fill="currentColor"/>
    <ellipse cx="18" cy="16" rx="3" ry="3" fill="currentColor" filter="brightness(1.3)"/>
    <line x1="18" y1="30" x2="18" y2="36" stroke="#2d6a4f" stroke-width="2"/>
    <ellipse cx="14" cy="33" rx="4" ry="2" fill="#2d6a4f" transform="rotate(-20 14 33)"/>
  </svg>`;}

function tulip(c){
  return`<svg width="32" height="42" viewBox="0 0 32 42" style="color:${c}">
    <path d="M16 18 Q8 10 9 2 Q14 6 16 12 Q18 6 23 2 Q24 10 16 18Z" fill="currentColor"/>
    <path d="M16 18 Q6 14 4 6 Q10 10 16 18Z" fill="currentColor" opacity=".7"/>
    <path d="M16 18 Q26 14 28 6 Q22 10 16 18Z" fill="currentColor" opacity=".7"/>
    <line x1="16" y1="18" x2="16" y2="42" stroke="#2d6a4f" stroke-width="2"/>
    <path d="M16 30 Q10 28 8 34 Q12 32 16 30Z" fill="#2d6a4f"/>
  </svg>`;}

const colors={rose:['#e8476a','#ff8fab','#c9184a','#ffb3c6','#ff4d6d','#ff006e'],
               tulip:['#ff6b9d','#845ec2','#ff9671','#ffd460','#ff5e78','#b5179e']};

// ── FOGOS & CONFETES ──
const fw=document.getElementById('fw');
const ctx=fw.getContext('2d');
let particles=[],confetti=[],fwActive=false,fwTimer=null;
const cColors=['#e8476a','#ffd460','#ff6b9d','#00f5d4','#845ec2','#ff9671','#fff','#ffb3c6'];

function resize(){fw.width=innerWidth;fw.height=innerHeight}
resize();addEventListener('resize',resize);

class Spark{constructor(x,y,col){this.x=x;this.y=y;this.col=col;const a=Math.random()*Math.PI*2,s=2+Math.random()*4;this.vx=Math.cos(a)*s;this.vy=Math.sin(a)*s;this.life=1;this.decay=.012+Math.random()*.018;this.r=2+Math.random()*2}
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=.06;this.vx*=.98;this.life-=this.decay}
  draw(){ctx.globalAlpha=this.life;ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fill()}}

class Confetto{constructor(){this.reset(true)}
  reset(init=false){this.x=Math.random()*innerWidth;this.y=init?Math.random()*-innerHeight:-20;this.w=6+Math.random()*8;this.h=3+Math.random()*5;this.col=cColors[Math.floor(Math.random()*cColors.length)];this.rot=Math.random()*Math.PI*2;this.vx=(Math.random()-.5)*2;this.vy=2+Math.random()*4;this.vr=(Math.random()-.5)*.15}
  update(){this.x+=this.vx;this.y+=this.vy;this.rot+=this.vr;if(this.y>innerHeight+20)this.reset()}
  draw(){ctx.save();ctx.globalAlpha=.85;ctx.fillStyle=this.col;ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.fillRect(-this.w/2,-this.h/2,this.w,this.h);ctx.restore()}}

function boom(x,y){const col=cColors[Math.floor(Math.random()*cColors.length)];for(let i=0;i<80;i++)particles.push(new Spark(x,y,col))}

function loop(){
  ctx.clearRect(0,0,fw.width,fw.height);
  // fogos
  particles=particles.filter(p=>{p.update();p.draw();return p.life>0});
  // confetes
  confetti.forEach(c=>{c.update();c.draw()});
  ctx.globalAlpha=1;
  if(fwActive)requestAnimationFrame(loop);
  else if(!particles.length&&!confetti.length){fw.style.display='none';}
}

const msg=document.createElement('div');
msg.id='bday-msg';
msg.innerText='🎂 FELIZ ANIVERSÁRIO\nPARA MINHA PRINCESA 👑';
Object.assign(msg.style,{position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%) scale(0)',zIndex:20,textAlign:'center',fontFamily:"'Cinzel',serif",fontSize:'clamp(1.4rem,5vw,3rem)',fontWeight:700,color:'#fff',textShadow:'0 0 30px #e8476a,0 0 60px #ff6b9d',lineHeight:1.4,letterSpacing:'.1em',pointerEvents:'none',transition:'transform .6s cubic-bezier(.34,1.56,.64,1), opacity .5s',opacity:0,whiteSpace:'pre',padding:'18px 28px',background:'rgba(0,0,0,.4)',borderRadius:'20px',border:'1px solid rgba(255,255,255,.15)',backdropFilter:'blur(8px)'});
document.body.appendChild(msg);

function startShow(){
  if(fwActive)return;
  fwActive=true;fw.style.display='block';
  setTimeout(()=>{msg.style.transform='translate(-50%,-50%) scale(1)';msg.style.opacity='1';},300);
  for(let i=0;i<80;i++)confetti.push(new Confetto());
  let t=0;
  const shoot=()=>{
    if(!fwActive)return;
    boom(Math.random()*innerWidth*.8+innerWidth*.1,Math.random()*innerHeight*.5+innerHeight*.05);
    t+=600;if(t<7000)fwTimer=setTimeout(shoot,600);
    else{fwActive=false;confetti=[];msg.style.transform='translate(-50%,-50%) scale(0)';msg.style.opacity='0';}
  };
  shoot();loop();
}

// dispara ao chegar no fim da página
let triggered=false;
window.addEventListener('scroll',()=>{
  if(triggered)return;
  const scrolled=window.scrollY+window.innerHeight;
  const total=document.body.scrollHeight;
  if(scrolled>=total-60){triggered=true;startShow();setTimeout(()=>{triggered=false},15000);}
});

const canvas=document.getElementById('canvas');
for(let i=0;i<22;i++){
  const div=document.createElement('div');
  div.className='fl';
  const isRose=Math.random()>.5;
  const palette=isRose?colors.rose:colors.tulip;
  const col=palette[Math.floor(Math.random()*palette.length)];
  div.innerHTML=isRose?rose(col):tulip(col);
  div.style.cssText=`left:${Math.random()*100}%;animation-duration:${8+Math.random()*14}s;animation-delay:${-Math.random()*16}s;`;
  canvas.appendChild(div);
}
</script>
</body>
</html>
